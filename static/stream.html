<!doctype html>
<html><head><meta charset="utf-8"><title>CAPRI LIVE</title>
<!-- TikTok LIVE Studio / OBS browser source: http://127.0.0.1:7777/stream.html  (1920x1080, put it ABOVE your game capture)
     ?swap=1  chat left, gif right      ?test=1  shows a box to type fake chat (rehearsal) -->
<style>
@font-face{font-family:Rajdhani;src:url(fonts/rajdhani-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Rajdhani;src:url(fonts/rajdhani-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Rajdhani;src:url(fonts/rajdhani-latin-700-normal.woff2) format("woff2");font-weight:700}
:root{--pink:#ff2a6d;--teal:#5de6d6;--yellow:#f5e663;--ink:rgba(6,8,20,.86);--line:rgba(255,42,109,.75)}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Rajdhani,"Segoe UI",sans-serif;color:#fff}
.panel{position:absolute;background:var(--ink);border:2px solid var(--line);box-shadow:0 0 22px rgba(255,42,109,.35),inset 0 0 30px rgba(255,42,109,.08);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.tag{position:absolute;top:-1px;left:22px;background:var(--pink);color:#08040c;font-weight:700;letter-spacing:.22em;font-size:15px;padding:3px 12px 2px}
/* ---- top-left: Capri */
#capri{top:28px;left:28px;width:460px;height:300px;overflow:hidden}
#capri img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.15)}
#capri .live{position:absolute;right:16px;top:12px;background:#e0102f;color:#fff;font-weight:700;font-size:15px;letter-spacing:.15em;padding:2px 9px;border-radius:3px;animation:blink 1.6s infinite}
#capri .live.off{background:#444;animation:none}
@keyframes blink{50%{opacity:.55}}
#capri .now{position:absolute;left:0;right:0;bottom:0;padding:9px 16px 8px;background:linear-gradient(transparent,rgba(0,0,0,.92) 40%);font-size:22px;font-weight:600}
#capri .now b{color:var(--teal);letter-spacing:.12em;font-size:15px;margin-right:8px}
/* ---- under it: the vote */
#vote{top:344px;left:28px;width:460px;padding:30px 18px 14px;box-sizing:border-box}
#vote .row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:21px;font-weight:600}
#vote .bar{flex:1;height:10px;background:rgba(255,255,255,.08);position:relative}
#vote .bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pink),var(--teal));transition:width .4s}
#vote .n{width:34px;text-align:right;color:var(--yellow)}
#vote .hint{font-size:17px;color:rgba(255,255,255,.7);margin-top:8px}
#vote .hint code{color:var(--teal);font-family:inherit;font-weight:700}
/* ---- top-right: chat */
#chat{top:28px;right:28px;width:400px;height:660px;display:flex;flex-direction:column;justify-content:flex-end;padding:34px 16px 14px;box-sizing:border-box}
#chat .msg{font-size:21px;line-height:1.25;margin:5px 0;word-wrap:break-word;animation:in .35s ease-out}
#chat .msg b{color:var(--teal);font-weight:700}
#chat .msg.gift b,#chat .msg.gift{color:var(--yellow)} #chat .msg.follow{color:#c9a8ff}
#chat .msg.cmd span{color:var(--pink);font-weight:700}
#chat .status{position:absolute;top:8px;right:16px;font-size:13px;color:rgba(255,255,255,.55);letter-spacing:.06em;max-width:215px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
/* ---- bottom: her reply */
#say{left:28px;right:28px;bottom:26px;height:176px;background:rgba(0,0,0,.93);display:flex;align-items:center;padding:20px 40px 16px 40px;box-sizing:border-box}
#say .txt{font-size:42px;font-weight:600;line-height:1.18;text-shadow:0 0 14px rgba(255,42,109,.35)}
#say .txt::after{content:"\2588";color:var(--pink);margin-left:4px;animation:blink 1s steps(1) infinite}
#say.idle .txt{color:rgba(255,255,255,.55)}
/* swap = chat left, gif right */
body.swap #capri,body.swap #vote{left:auto;right:28px} body.swap #chat{right:auto;left:28px}
/* ---- PORTRAIT (TikTok vertical, 1080x1920): ?portrait=1
   top: gif left + chat right | middle (y 700-1308): the game | under it: the vote | bottom: her reply */
body.portrait{width:1080px;height:1920px}
body.portrait #capri{top:28px;left:28px;width:500px;height:330px}
body.portrait #chat{top:28px;right:28px;width:500px;height:644px}
body.portrait #vote{top:374px;left:28px;width:500px;height:298px}
body.portrait #vote .row span:first-child{width:170px!important}
body.portrait #say{top:1340px;bottom:auto;height:550px;align-items:flex-start;padding:46px 44px 30px}
body.portrait #say .txt{font-size:52px;line-height:1.2}
body.portrait #test{top:1300px;right:28px;width:500px}
body.portrait .gameframe{display:block}
.gameframe{display:none;position:absolute;left:0;top:700px;width:1080px;height:608px;box-sizing:border-box;border-top:3px solid var(--pink);border-bottom:3px solid var(--pink);
  box-shadow:0 0 24px rgba(255,42,109,.45);pointer-events:none}
.gameframe span{position:absolute;right:18px;top:-15px;background:var(--pink);color:#08040c;font-weight:700;letter-spacing:.2em;font-size:15px;padding:3px 10px 2px}
/* rehearsal box */
#test{position:absolute;right:28px;top:700px;width:400px;display:none;gap:6px}
body.test #test{display:flex}
#test input{background:#111;border:1px solid var(--pink);color:#fff;font:inherit;font-size:18px;padding:6px 8px}
#test input.u{width:110px} #test input.t{flex:1}
body.swap #test{right:auto;left:28px}
</style></head>
<body>
<div id="capri" class="panel"><img id="gif" src="gif2453.gif" alt=""><span class="tag">CAPRI</span><span class="live off" id="live">OFFLINE</span>
  <div class="now"><b>NOW</b><span id="task">free roaming</span></div></div>
<div id="vote" class="panel"><span class="tag">CHAT VOTES NEXT <span id="left"></span></span><div id="rows"></div>
  <div class="hint">type <code>!wood</code> <code>!diamonds</code> <code>!build</code> <code>!explore</code> <code>!play</code></div></div>
<div id="chat" class="panel"><span class="tag">LIVE CHAT</span><span class="status" id="status"></span><div id="msgs"></div></div>
<div class="gameframe"><span>AUTOPILOT</span></div>
<div id="say" class="panel idle"><span class="tag">CAPRI</span><div class="txt" id="txt">booting up...</div></div>
<form id="test"><input class="u" id="tu" value="viewer" placeholder="name"><input class="t" id="tt" placeholder="type fake chat, Enter"></form>
<script src="capri_voice.js"></script>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get("swap") === "1") document.body.classList.add("swap");
if (Q.get("test") === "1") document.body.classList.add("test");
if (Q.get("portrait") === "1") document.body.classList.add("portrait");
const GIF = {idle:"gif2453.gif", greet:"gif2454.gif", hyped:"gif2455.gif", working:"gif2456.gif", alert:"gif_error.gif", talking:"gif2454.gif"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastReply = "", lastChatKey = "", mood = "", SET = {voice_engine: "beeps"};
const loadSet = () => fetch("/api/settings").then(r => r.json()).then(s => SET = s).catch(() => {});
loadSet(); setInterval(loadSet, 15000);
const TYPER = new CapriVoice.Typer(t => { $("txt").textContent = t; });

function typeOut(text){                    // her reply types out; with the BEEPS voice every letter blips (OBS: tick "Control audio via OBS" to hear it on stream)
  $("say").classList.remove("idle");
  const eng = CapriVoice.engine(SET);
  TYPER.start(text, {sound: eng === "beeps", pitch: SET.voice_pitch || "normal", volume: SET.voice_volume == null ? 0.6 : SET.voice_volume, mood: mood});
  if (eng !== "beeps" && eng !== "off") fetch("/api/tts", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text, engine: eng})})
      .then(r => r.ok ? r.blob() : null).then(b => { if (b && b.size > 100) new Audio(URL.createObjectURL(b)).play().catch(() => {}); }).catch(() => {});
}

async function tick(){
  let s; try { s = await (await fetch("/api/stream")).json(); } catch(e){ $("status").textContent = "CAPRI OFFLINE"; return; }
  $("live").textContent = s.live ? "LIVE" : "OFFLINE"; $("live").className = "live" + (s.live ? "" : " off");
  $("status").textContent = (s.viewers ? s.viewers + " watching · " : "") + (s.status || "");
  $("task").textContent = s.task || "free roaming";
  const m = s.mood || "idle"; if (m !== mood){ mood = m; $("gif").src = GIF[m] || GIF.idle; }
  $("left").textContent = s.live ? "· " + s.vote_left + "s" : "";
  const max = Math.max(1, ...s.votes.map(v => v.n));
  $("rows").innerHTML = s.votes.length ? s.votes.map(v => `<div class="row"><span style="width:190px">${esc(v.cmd)}</span><span class="bar"><i style="width:${100*v.n/max}%"></i></span><span class="n">${v.n}</span></div>`).join("")
                                       : `<div class="row" style="color:rgba(255,255,255,.55)">no votes yet</div>`;
  const key = s.chat.map(c => c.t).join(",");
  if (key !== lastChatKey){
    lastChatKey = key;
    $("msgs").innerHTML = s.chat.slice(-12).map(c => {
      const cmd = c.text.startsWith("!");
      return `<div class="msg ${c.kind}${cmd ? " cmd" : ""}"><b>${esc(c.user)}</b> ${cmd ? `<span>${esc(c.text)}</span>` : esc(c.text)}</div>`;
    }).join("");
  }
  if (s.reply && s.reply !== lastReply){ lastReply = s.reply; typeOut(s.reply); }
  if (!s.reply && !s.live){ $("txt").textContent = "say \"start stream mode\" to Capri"; $("say").classList.add("idle"); }
}
setInterval(tick, 700); tick();

$("test").addEventListener("submit", e => {
  e.preventDefault(); const t = $("tt").value.trim(); if (!t) return;
  fetch("/api/stream/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({user: $("tu").value || "viewer", text: t})});
  $("tt").value = "";
});
</script>
</body></html>
