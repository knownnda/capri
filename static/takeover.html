<!doctype html>
<html><head><meta charset="utf-8"><title>CAPRI AUTOPILOT</title>
<style>
@font-face{font-family:Rajdhani;src:url(fonts/rajdhani-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Rajdhani;src:url(fonts/rajdhani-latin-700-normal.woff2) format("woff2");font-weight:700}
:root{--pink:#ff2a6d;--teal:#5de6d6;--green:#3dff9a;--ink:rgba(6,10,28,.78)}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Rajdhani,"Segoe UI",sans-serif;color:#fff;user-select:none}
#frame{position:fixed;inset:6px;border:2px solid rgba(255,42,109,.55);box-shadow:inset 0 0 40px rgba(255,42,109,.18),0 0 18px rgba(255,42,109,.35);
  animation:pulse 2.4s ease-in-out infinite;opacity:0;transition:opacity .5s}
body.on #frame{opacity:1}
@keyframes pulse{50%{border-color:rgba(93,230,214,.6);box-shadow:inset 0 0 50px rgba(93,230,214,.16),0 0 22px rgba(93,230,214,.35)}}
.c{position:fixed;width:46px;height:46px;border:4px solid var(--pink)}
.tl{top:0;left:0;border-right:0;border-bottom:0}.tr{top:0;right:0;border-left:0;border-bottom:0}
.bl{bottom:0;left:0;border-right:0;border-top:0}.br{bottom:0;right:0;border-left:0;border-top:0}
#top{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);border:1px solid var(--pink);padding:6px 22px 5px;
  letter-spacing:.32em;font-weight:700;font-size:15px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);white-space:nowrap}
#top b{color:var(--pink)} #top i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink);margin-right:10px;animation:blink 1s steps(2) infinite;vertical-align:1px}
@keyframes blink{50%{opacity:.15}}
#hud{position:fixed;left:22px;bottom:22px;max-width:min(520px,60vw);background:var(--ink);border-left:3px solid var(--teal);padding:10px 16px 12px}
#hud .k{font-size:11px;letter-spacing:.28em;color:var(--teal)} #hud .v{font-size:19px;font-weight:600;line-height:1.2;margin:2px 0 8px}
#hud code{font-family:Consolas,monospace;font-size:13px;color:var(--green)} #last{font-size:14px;color:#cfd6ff;opacity:.85}
#out{position:fixed;right:22px;bottom:22px;background:var(--ink);border:1px solid var(--teal);padding:8px 14px;font-size:13px;letter-spacing:.2em;font-weight:700;color:var(--teal)}
#out kbd{font-family:inherit;border:1px solid var(--teal);padding:0 6px;margin:0 3px}
#scan{position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
body:not(.on) #top,body:not(.on) #hud,body:not(.on) #out,body:not(.on) .c{opacity:0}
#top,#hud,#out,.c{transition:opacity .4s}
</style></head>
<body>
<div id="frame"></div><div id="scan"></div>
<div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
<div id="top"><i></i>CAPRI <b>//</b> AUTOPILOT ENGAGED</div>
<div id="hud">
  <div class="k">GAME</div><div class="v" id="game">MINECRAFT</div>
  <div class="k">TASK <span id="time"></span></div><div class="v" id="task">...</div>
  <code id="cmd"></code>
  <div id="last"></div>
</div>
<div id="out">SAY "STOP" OR PRESS <kbd>F8</kbd></div>
<script>
const $ = s => document.querySelector(s);
const fmt = s => (s >= 3600 ? Math.floor(s / 3600) + ":" : "") + String(Math.floor(s / 60) % 60).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
async function tick(){
  try{
    const d = await (await fetch("/api/takeover")).json();
    document.body.classList.toggle("on", !!d.active);
    if (d.active){
      $("#game").textContent = (d.game || "GAME").toUpperCase();
      $("#task").textContent = d.task || "";
      $("#cmd").textContent = d.command ? "> " + d.command : "";
      $("#time").textContent = "// " + fmt(d.elapsed || 0);
      $("#last").textContent = d.last ? "GAME: " + d.last : "";
    }
  }catch(e){}
}
setInterval(tick, 1000); tick();
</script>
</body></html>
