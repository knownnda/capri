<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CAPRI TIMER</title>
<style>
@font-face{font-family:"Rajdhani";font-weight:500;src:url("fonts/rajdhani-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Rajdhani";font-weight:700;src:url("fonts/rajdhani-latin-700-normal.woff2") format("woff2")}
*{box-sizing:border-box;margin:0}
html,body{width:300px;background:transparent;overflow:hidden;font-family:"Rajdhani","Bahnschrift",system-ui,sans-serif;font-weight:500;user-select:none}
#list{display:flex;flex-direction:column;gap:8px;padding:8px}
.t{position:relative;height:66px;padding:6px 12px 8px 16px;background:rgba(4,16,14,.82);border:1px solid #3dff9a;box-shadow:0 0 14px rgba(61,255,154,.35),inset 0 0 14px rgba(61,255,154,.08);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));color:#d8ffe6}
.t::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#3dff9a;box-shadow:0 0 8px #3dff9a}
.k{font-size:12px;letter-spacing:.22em;color:#3dff9a;font-weight:700}
.big{font-size:30px;font-weight:700;letter-spacing:.06em;line-height:1;text-shadow:0 0 10px rgba(61,255,154,.8);font-variant-numeric:tabular-nums}
.sub{position:absolute;right:16px;top:8px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:#8fd8b7}
.bar{position:absolute;left:16px;right:14px;bottom:6px;height:3px;background:rgba(61,255,154,.2)}
.bar i{display:block;height:100%;background:#3dff9a;box-shadow:0 0 6px #3dff9a}
.t.low{border-color:#ff2a6d;color:#ffd6e3;box-shadow:0 0 16px rgba(255,42,109,.5),inset 0 0 14px rgba(255,42,109,.1)}
.t.low::before{background:#ff2a6d;box-shadow:0 0 8px #ff2a6d}.t.low .k{color:#ff2a6d}.t.low .big{text-shadow:0 0 10px rgba(255,42,109,.9);animation:pulse .6s steps(2,end) infinite}
.t.low .bar{background:rgba(255,42,109,.25)}.t.low .bar i{background:#ff2a6d;box-shadow:0 0 6px #ff2a6d}
@keyframes pulse{50%{opacity:.55}}
</style></head>
<body><div id="list"></div>
<script>
let off = 0, timers = [];
const fmt = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}`; };
async function poll(){ try{ const d = await (await fetch("/api/timers")).json(); off = d.now - Date.now() / 1000; timers = d.timers; }catch(e){} }
function draw(){
  const now = Date.now() / 1000 + off, L = document.querySelector("#list");
  const items = timers.slice().sort((a, b) => a.due - b.due).slice(0, 5);
  while (L.children.length > items.length) L.lastChild.remove();
  while (L.children.length < items.length){ const e = document.createElement("div"); e.className = "t"; e.innerHTML = '<div class="k"></div><div class="big"></div><div class="sub"></div><div class="bar"><i></i></div>'; L.appendChild(e); }
  items.forEach((t, i) => {
    const e = L.children[i], left = t.due - now, total = t.total || 60;
    e.classList.toggle("low", left <= 10);
    e.querySelector(".k").textContent = t.kind === "timer" ? "// TIMER" : "// REMINDER";
    e.querySelector(".big").textContent = fmt(left);
    e.querySelector(".sub").textContent = t.text || t.label || "";
    e.querySelector(".bar i").style.width = Math.max(0, Math.min(100, left / total * 100)) + "%";
  });
}
poll(); setInterval(poll, 1500); setInterval(draw, 250);
</script></body></html>
